; ════════════════════════════════════════════════════════════════
;  🚂 supervisord — دو process در یک کانتینر
;
;  چرا `sh -c "python bot.py & uvicorn ..."` نه؟
;  آن الگو shell را PID 1 می‌کند و سه مشکل دارد:
;    ۱) سیگنال: docker stop/SIGTERM به shell می‌رسد و لزوماً به
;       بچه‌ها منتقل نمی‌شود ⇒ kill -9 بعد از ۱۰ ثانیه ⇒ پیام
;       half-sent و صف job_queue نیمه‌کاره می‌ماند.
;    ۲) مرگ: اگر bot.py بمیرد، uvicorn بی‌خبر می‌ماند. ربات برای
;       همیشه خاموش می‌ماند در حالی که سرویس «سالم» به‌نظر می‌رسد.
;    ۳) بی‌نظمی: خروج‌انتقادی ندارد، zombie نمی‌گیرد، لاگ را جدا
;       نمی‌کند و زنجیره‌ی restart ندارد.
;  supervisor PID 1 می‌شود (از طریق entrypoint)، zombieها را reaping
;  می‌کند، هر child را جدا restart می‌کند و SIGTERM را به هر دو
;  process می‌فرستد.
;
;  ⚠️ این فایل داخل image کپی می‌شود؛ مسیرها مطلق‌اند (/srv/humsyar).
;  مفسرها را از PATH همان image برمی‌دارد. برای اجرای لوکال (خارج از
;  کانتینر) باید /srv/humsyar و /usr/local/bin/{python,uvicorn} به مسیر
;  محیط خودتان تغییر کنند، وگرنه supervisor فایل‌ها را پیدا نمی‌کند.
; ════════════════════════════════════════════════════════════════

[supervisord]
nodaemon=true
; لاگ‌ها به فایل نروند: در کانتینر منبع حقیقت stdout/stderr است
; (Railway آنجا را می‌خواند). supervisord خودش را روی stdout می‌نویسد.
logfile=/dev/null
logfile_maxbytes=0
; pidfile پیش‌فرض در /var/run است و ممکن است نوشتن‌پذیر نباشد؛
; /tmp همیشه برای کاربر non-root قابل نوشتن است.
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
directory=/srv/humsyar
# عمداً هیچ user= اینجا نیست: کاربر non-root در خودِ image با دستور
# USER humsyar ست شده و supervisord هم همان‌جا به‌دنیا می‌آید.
# گذاشتن user= هم‌نام فقط یک نقطه‌شکست اضافی است — اگر آن کاربر در
# ایمیجِ بازطراحی‌شده وجود نداشته باشد supervisord با
# «Error: Invalid user name» اصلاً بالا نمی‌آید (هر دو process می‌میرند).
loglevel=info

; ── گروه: هر سه با هم stop می‌شوند (shutdown تمیز) ──
[group:humsyar]
programs=api,bot,botapi
priority=999

; 🌐 API — uvicorn. PORT از محیط Railway خوانده می‌شود.
; --workers عمداً ۱ است: workers>1 در یک container با این حجم RAM
; بی‌فایده است و هر worker یک connection pool مونگو می‌سازد.
[program:api]
command=/usr/local/bin/uvicorn api.main:app --host 0.0.0.0 --port %(ENV_PORT)s --proxy-headers --forwarded-allow-ips "*"
directory=/srv/humsyar
; stdout_logfile در کانتینر = stdout خود supervisord ⇒ در لاگ Railway دیده می‌شود
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; graceful: به uvicorn اول SIGTERM (shutdown تمیز connectionها)
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
startsecs=8
startretries=20
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/srv/humsyar"

; 🤖 Bot — polling تلگرام + job_queue.
; -u: لاگ فوری بدون بافر (وگرنه crashهای آخر در بافر گم می‌شوند).
[program:bot]
command=/usr/local/bin/python -u bot.py
directory=/srv/humsyar
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
; bot.py باید on_cleanup/حالت‌های باز را ببندد ⇒ SIGTERM و مهلت کافی.
; اگر بعد از stopwaitsecs زنده بود، supervisor خودش به SIGKILL می‌رود.
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
; bot بدون Telegram token بالا نمی‌آید و exit(1) می‌کند؛ startsecs=5
; باعث می‌شود supervisor آن را «موفق» حساب نکند و backoff کند
; (restart بی‌نهایت با فاصله‌ی رشد‌کرده، نه busy-loop).
startsecs=5
startretries=30
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/srv/humsyar"

; 🔧 Local Bot API — فقط برای Dedicated Rename Pipeline (همون منابع Railway)
; اگر TELEGRAM_API_ID/HASH ست نباشد، اسکریپت sleep می‌کند و هیچ منبعی مصرف نمی‌کند
; این سرویس فقط download/upload رینیم را انجام می‌دهد؛ بقیه ربات همچنان Cloud API
[program:botapi]
command=/usr/local/bin/start_botapi.sh
directory=/srv/humsyar
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
startsecs=5
startretries=30
environment=PYTHONUNBUFFERED="1",PYTHONPATH="/srv/humsyar"

; ── ctl socket برای دیباگ (supervisorctl status داخل کانتینر) ──
; Railway لاگ‌ها را می‌خواند؛ این فقط برای shell داخل کانتینر است.
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
