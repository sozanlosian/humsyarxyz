# ══════════════════════════════════════════════════════════════
# HumsYarX — استقرار تک‌سروری (VPS) : اپ + مونگو + Caddy
# 🌊 VPS-DEPLOY
#
# استفاده:
#   cp vps.env.example .env   # و بعد مقادیر واقعی را در .env بگذار
#   docker compose up -d --build
#
# معماری:
#   اینترنت ──(80/443)──▶ Caddy (ریورس‌پروکسی + HTTPS خودکار)
#                             ──▶ app:8000 (همه‌چیز: /api ،/app ،/admin)
#                             ──▶ mongo:27017 (فقط داخلی، بدون دسترسی بیرونی)
# ══════════════════════════════════════════════════════════════

name: humsyarx

services:
  # ── اپ اصلی: همان Dockerfile (تغییر لازم ندارد) ──
  # supervisord داخل کانتینر هر سه را بالا می‌آورد: api + bot + botapi
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # MONGODB_URI این‌جا ساخته می‌شود تا MONGO_USER/PASS فقط یک‌بار در .env باشند
      # (داخل env_file جایگذاری ${} انجام نمی‌شود، ولی این‌جا می‌شود)
      MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongo:27017/humsyar?authSource=admin"
      PORT: "8000"
      TZ: Asia/Tehran
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - humsyar

  # ── دیتابیس: مونگو ۷ با احرازهویت + ماندگاری داده روی volume ──
  # ⚠️ پورت بیرون داده نشده (فقط expose) — از اینترنت قابل دسترسی نیست
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: humsyar
    volumes:
      - mongodata:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - humsyar

  # ── Caddy: ریورس‌پروکسی + صدور/تمدید خودکار گواهی HTTPS ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app
    networks:
      - humsyar

volumes:
  mongodata:      # داده‌ی مونگو — با rebuild پاک نمی‌شود
  caddydata:      # گواهی‌های HTTPS
  caddyconfig:

networks:
  humsyar:
