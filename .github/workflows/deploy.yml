# HumsYarX — استقرار خودکار روی VPS با هر push به main
#
# پیش‌نیاز (یک‌بار): سه Secret در گیت‌هاب
#   Settings → Secrets and variables → Actions → New repository secret
#   VPS_HOST    = آی‌پی سرور (مثل 45.74.158.153)
#   VPS_USER    = نام کاربر SSH (مثل root)
#   VPS_SSH_KEY = کلید خصوصی (کل متن -----BEGIN ... END-----)
#
# روی سرور هم باید یک‌بار دستی مستقر شده باشد در: /srv/humsyarx
#
# نکته‌ی مهم (سرور ۱ گیگی!): ریبیلد فقط وقتی انجام می‌شود که فایل‌های
# اجرایی عوض شده باشند. اگر چیزی عوض نشده یا فقط .github / md عوض شده،
# بدون ریبیلد فقط مطمئن می‌شود سرویس‌ها بالا هستند (سبک و سریع).

name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# اگر دو push پشت سر هم آمد، ران‌ها صف می‌شوند (نه موازی) تا روی
# سرور ۱ گیگی دو بیلد همزمان لود را منفجر نکند.
concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull + rebuild on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /srv/humsyarx
            BEFORE=$(git rev-parse HEAD)
            git pull --ff-only
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              echo "NO-CHANGES: same commit, skipping rebuild."
              docker compose up -d --no-deps app caddy
              docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health
              exit 0
            fi
            RUNTIME_CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" | grep -v -e '^\.github/' -e '\.md$' || true)
            if [ -z "$RUNTIME_CHANGED" ]; then
              echo "NON-RUNTIME-ONLY changes, skipping rebuild:"
              git diff --name-only "$BEFORE" "$AFTER"
              docker compose up -d --no-deps app caddy
              docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health
              exit 0
            fi
            echo "Runtime files changed, rebuilding:"
            echo "$RUNTIME_CHANGED"
            docker compose up -d --build --no-deps app caddy
            for i in $(seq 1 12); do
              docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health && break || sleep 10
            done
            docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health
            docker image prune -f
