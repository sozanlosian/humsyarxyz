name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    name: Pull + rebuild on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /srv/humsyarx
            git pull --ff-only
            docker compose up -d --build --no-deps app caddy
            for i in $(seq 1 12); do
              docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health && break || sleep 10
            done
            docker compose exec -T app curl -fsS http://127.0.0.1:8000/api/health
            docker image prune -f
